services:
  - type: web
    name: prem-portfolio
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
    headers:
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
